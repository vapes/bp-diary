name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing mode
        run: echo "SIGNED=${{ secrets.SIGNING_PASSWORD != '' }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../bp-diary.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bp-diary-apk
          path: bp-diary.apk

      - name: Publish release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Дневник давления 1.${{ github.run_number }}
          body: |
            Скачайте **bp-diary.apk** ниже и откройте на телефоне Android.
            Постоянная ссылка на последнюю версию: https://github.com/${{ github.repository }}/releases/latest/download/bp-diary.apk
          files: bp-diary.apk
          make_latest: true

      - name: Unsigned build notice
        if: env.SIGNED != 'true'
        run: echo "::warning::Secret SIGNING_PASSWORD is not set — APK is debug-signed and was not published as a release (see the build artifact)."
